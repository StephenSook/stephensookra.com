<!doctype html>
<!--
  A text-only project poster in the house style of the film title frames (Case Light,
  Glare Zone): a dark frame, a large pale-yellow title, a bold white line and a small grey
  line. scripts/posters/make-text-poster.mjs fills it from scripts/posters/<slug>.json and
  renders it at 2x, then scales it to the posters' 720 by 405.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Text poster</title>
    <style>
      @font-face {
        font-family: "Familjen Grotesk";
        font-weight: 400;
        src: url("../../public/xr/fonts/familjen-grotesk-latin-400-normal.woff") format("woff");
      }
      @font-face {
        font-family: "Familjen Grotesk";
        font-weight: 600;
        src: url("../../public/xr/fonts/familjen-grotesk-latin-600-normal.woff") format("woff");
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 720px;
        height: 405px;
        background: radial-gradient(ellipse 75% 85% at 38% 50%, #1c1e20 0%, #131517 55%, #0b0d0c 100%);
        font-family: "Familjen Grotesk", sans-serif;
        display: grid;
        align-content: center;
        /* Wider than the film posters' 34 px: in the case's right-hand slots, the slot's inner
           wall hides the left edge of the poster from the camera. */
        padding: 0 64px;
      }
      .title {
        color: #f8eaa0;
        font-weight: 600;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -0.01em;
      }
      .line {
        color: #e3e5e7;
        font-weight: 600;
        font-size: 30px;
        line-height: 1.2;
        max-width: 540px;
        margin-top: 18px;
      }
      .role {
        color: #909296;
        font-size: 16px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <p class="title"></p>
    <p class="line"></p>
    <p class="role"></p>
    <script>
      const params = new URLSearchParams(location.search);
      for (const key of ["title", "line", "role"]) document.querySelector(`.${key}`).textContent = params.get(key);
    </script>
  </body>
</html>
